# Politique de licences, vérifiée en CI par `cargo deny check licenses`.
#
# Le projet est sous Apache-2.0 : on n'accepte que des licences compatibles avec
# une redistribution permissive. Aucune GPL/LGPL/AGPL dans l'arbre aujourd'hui,
# et l'objectif est que ça reste vrai — d'où l'échec en CI si l'une apparaît.

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  # Copyleft par fichier : les crates concernées (pile GTK/WebKit de Tauri) sont
  # seulement liées, jamais modifiées. Voir THIRD-PARTY.md.
  "MPL-2.0",
  # Magasin de certificats racines de Mozilla, permissif.
  "CDLA-Permissive-2.0",
]
# La police Inter (OFL-1.1) est une dépendance npm : cargo-deny ne voit que
# l'arbre Rust, son obligation est traitée dans THIRD-PARTY.md.
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[advisories]
# Les avis de sécurité ont leur propre rythme : ils ne doivent pas bloquer une
# PR fonctionnelle. À surveiller séparément.
yanked = "warn"
