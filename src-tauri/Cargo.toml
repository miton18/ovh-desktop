[package]
name = "ovh-desktop"
version = "0.0.1-rc1"
description = "O.V.H. — console de management OVHcloud alternative (Olès Va Hurler)"
authors = ["@miton18"]
license = "Apache-2.0"
repository = "https://github.com/miton18/ovh-desktop"
edition = "2021"
rust-version = "1.77.2"

# Le binaire n'est qu'un point d'entrée : toute la logique vit dans la lib,
# ce qui la rend testable et compilable pour les cibles mobiles.
[lib]
name = "ovh_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
log = "0.4"
keyring = "4"
sha1 = "0.10"
hex = "0.4"
url = "2"
futures = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
keyring = "4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
